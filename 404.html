<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <!-- Paths start with / because GitHub Pages serves this page for any missing address. -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css?v=1">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t)}}catch(e){}</script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">Xudong Tang</a>
    </div>
  </header>
  <main class="wrap">
    <div class="error-page">
      <p class="eyebrow">Error 404</p>
      <h1>Page not found</h1>
      <p class="lead">There is nothing at this address. It may have moved, or the link may be wrong.</p>
      <ul class="link-row">
        <li><a href="/">Go to the home page</a></li>
        <li><a href="/archive/">Previous site</a></li>
      </ul>
    </div>
  </main>
</body>
</html>
